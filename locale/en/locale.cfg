[mod-name]
pipeline-hover=Pipeline Hover Visualizer

[mod-description]
pipeline-hover=Restores automatic pipeline visualization on mouse-over in alt mode. See connected pipelines, underground links, fluid colors, contents icons, and live amounts without clicking or pressing another key.

[mod-setting-name]
pipeline-hover-enabled=Enable pipeline hover visualization
pipeline-hover-show-icons=Show fluid icons along pipelines
pipeline-hover-show-contents=Show pipeline contents above hovered entity
pipeline-hover-max-nodes=Maximum fluid storages to highlight

[mod-setting-description]
pipeline-hover-enabled=Automatically highlight connected pipelines when hovering over a fluid entity in alt mode.
pipeline-hover-show-icons=Show the actual fluid's icon at intervals along highlighted pipelines. Empty pipelines remain gray.
pipeline-hover-show-contents=Show each connected pipeline's fluid, amount, total capacity, and temperature. Updates twice per second.
pipeline-hover-max-nodes=Limit work per hover for very large networks. A message appears if the highlight is incomplete. Machines can have several independent fluid storages. Pipeline contents still report the full segment amount.

[pipeline-hover]
contents=__1__ __2__: __3__ / __4__ · __5__ °C
empty=Empty pipeline · 0 / __1__
truncated=Showing first __1__ fluid storages (limit in Mod settings)
